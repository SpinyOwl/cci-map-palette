plugins {
	id "architectury-plugin" version "3.4.162"
	id "dev.architectury.loom" version "1.7.435" apply false
	id "io.github.themrmilchmann.curseforge-publish" version "0.7.0"
}

apply from: "https://raw.githubusercontent.com/FTBTeam/mods-meta/main/gradle/changelog.gradle"

architectury {
	minecraft = rootProject.minecraft_version
}

subprojects {
	apply plugin: "dev.architectury.loom"

	loom {
		silentMojangMappingsLicense()
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		mappings loom.officialMojangMappings()
	}
}

allprojects {
	apply plugin: "java"
	apply plugin: "architectury-plugin"
	apply plugin: "maven-publish"

	version = project.mod_version
	group = project.maven_group
	archivesBaseName = project.archives_base_name

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17

	compileJava {
		options.encoding = "UTF-8"
		options.release = 17
	}

	repositories {
		mavenLocal()
		maven {
			url "https://maven.architectury.dev/"
			content {
				includeGroup "dev.architectury"
			}
		}

		maven {
			url "https://maven.minecraftforge.net"
			content {
				includeGroup "net.minecraftforge"
			}
		}

		maven {
			url "https://maven.ftb.dev/releases"
			content {
				includeGroup "dev.ftb.mods"
			}
		}
	}

	java {
		withSourcesJar()
	}
}

def curseforgeProjectId = providers.gradleProperty("curseforge_project_id")
	.orElse(providers.environmentVariable("CURSEFORGE_PROJECT_ID"))
def curseforgeApiToken = providers.gradleProperty("curseforgeApiToken")
	.orElse(providers.environmentVariable("CURSEFORGE_API_TOKEN"))
def curseforgeReleaseType = providers.gradleProperty("curseforge_release_type").orElse("beta")
def curseforgeChangelogFile = providers.gradleProperty("curseforge_changelog_file").orElse("CHANGELOG.md")
def curseforgeMinecraftVersion = providers.gradleProperty("curseforge_minecraft_version").orElse(providers.provider {
	project.minecraft_version
})
def curseforgeMinecraftVersionType = providers.gradleProperty("curseforge_minecraft_version_type").orElse(providers.provider {
	def parts = project.minecraft_version.split("\\.")
	parts.length >= 2 ? "minecraft-${parts[0]}-${parts[1]}" : "minecraft-${project.minecraft_version}"
})
def curseforgeReleaseTypeEnum = provider {
	io.github.themrmilchmann.gradle.publish.curseforge.ReleaseType.valueOf(
		curseforgeReleaseType.get().toUpperCase(Locale.ROOT)
	)
}

curseforge {
	if (curseforgeApiToken.present) {
		apiToken = curseforgeApiToken.get()
	}

	publications {
		register("fabric") {
			if (curseforgeProjectId.present) {
				projectId = curseforgeProjectId.get()
			}

			gameVersion("modloader", "fabric")
			gameVersion(curseforgeMinecraftVersionType.get(), curseforgeMinecraftVersion.get())
			javaVersion(JavaVersion.VERSION_17)

			artifacts.register("main") {
				from(project(":fabric").tasks.named("remapJar"))
				displayName = "${project.readable_name} Fabric ${project.version}"
				releaseType = curseforgeReleaseTypeEnum.get()

				changelog {
					format = io.github.themrmilchmann.gradle.publish.curseforge.ChangelogFormat.MARKDOWN
					from(file(curseforgeChangelogFile.get()))
				}

				relations {
					requiredDependency("architectury-api")
					requiredDependency("fabric-api")
					requiredDependency("ftb-chunks-fabric")
				}
			}
		}

		register("forge") {
			if (curseforgeProjectId.present) {
				projectId = curseforgeProjectId.get()
			}

			gameVersion("modloader", "forge")
			gameVersion(curseforgeMinecraftVersionType.get(), curseforgeMinecraftVersion.get())
			javaVersion(JavaVersion.VERSION_17)

			artifacts.register("main") {
				from(project(":forge").tasks.named("remapJar"))
				displayName = "${project.readable_name} Forge ${project.version}"
				releaseType = curseforgeReleaseTypeEnum.get()

				changelog {
					format = io.github.themrmilchmann.gradle.publish.curseforge.ChangelogFormat.MARKDOWN
					from(file(curseforgeChangelogFile.get()))
				}

				relations {
					requiredDependency("architectury-api")
					requiredDependency("ftb-chunks-forge")
				}
			}
		}
	}
}

tasks.register("curseforgePublish") {
	group = "publishing"
	description = "Publish Fabric and Forge jars to CurseForge using the configured project id and API token."
	dependsOn("build", "publishFabricPublicationToCurseForge", "publishForgePublicationToCurseForge")
}
