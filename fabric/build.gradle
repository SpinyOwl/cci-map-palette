plugins {
	id "com.github.johnrengelman.shadow" version "7.0.0"
}

architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
	dev
}

def generatedResources = file("src/generated/resources")
def accessWidenerFile = project(":common").file("src/main/resources/cci_map_palette.accesswidener")

loom {
	accessWidenerPath = accessWidenerFile
}

sourceSets {
	main {
		resources {
			srcDir generatedResources
		}
	}
}

artifacts {
	dev(jar)
}

dependencies {
	modApi "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
	modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"
	modImplementation(include("io.github.llamalad7:mixinextras-fabric:0.4.1"))
	modImplementation "dev.ftb.mods:ftb-chunks-fabric:${rootProject.ftb_chunks_version}"

	common(project(path: ":common", configuration: "dev")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"description": project.mod_description,
				"homepage": project.mod_homepage_url,
				"sources": project.mod_sources_url,
				"issues": project.mod_issues_url,
				"license": project.mod_license,
				"archversion": project.architectury_version,
				"fabricapiversionrange": project.fabric_api_version_range,
				"mcversion": project.minecraft_version,
				"ftbchunksversionrange": project.ftb_chunks_version_range
	}
}

sourcesJar {
}

shadowJar {
	configurations = [project.configurations.shadowCommon]
	archiveClassifier = "dev-shadow"
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveBaseName.set "${rootProject.archives_base_name}-${project.name}"
	archiveClassifier.set null
}

jar {
	archiveClassifier = "dev"
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}
